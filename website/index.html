<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathon Project</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <!-- Custom CSS (now properly linked) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MyApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Features</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Top Row with Centered Text Box -->
  <div class="top-row">
    <div class="container">
      <div class="centered-text-box text-center">
        <h2>Welcome to Our Project</h2>
        <p class="lead">This text box is perfectly centered</p>
        <button class="btn btn-primary mt-3">Call to Action</button>
      </div>
    </div>
  </div>

  <!-- Two Column Section -->
  <div class="container my-5">
    <div class="row g-4">
      <div class="col-md-6">
        <div class="column-content">
          <h3><i class="bi bi-code-slash"></i> Left Column</h3>
          <p>Content goes here.</p>
        </div>
      </div>
      <div class="col-md-6">
        <div class="column-content">
          <h3><i class="bi bi-lightning-charge"></i> Right Column</h3>
          <p>More content here.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2023 Hackathon Team</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
